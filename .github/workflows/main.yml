name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Project Structure and Source Code
      run: |
        # Tạo cấu trúc thư mục chuẩn của Android Project
        mkdir -p app/src/main/java/com/example/killtracker
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/values

        # 1. Tạo gradle.properties
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        # 2. Tạo settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "KillTracker"
        include ':app'
        EOF

        # 3. Tạo build.gradle cấp root
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        # 4. Tạo app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.killtracker'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.killtracker"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 5. Tạo AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="GmsQuickKiller"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".GameDetectService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>

            </application>
        </manifest>
        EOF

        # 6. Tạo file cấu hình accessibility_service_config.xml
        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault"
            android:canRetrieveWindowContent="false"
            android:notificationTimeout="100" />
        EOF

        # 7. Tạo mã nguồn MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/example/killtracker/MainActivity.kt
        package com.example.killtracker

        import android.content.Context
        import android.content.Intent
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.widget.EditText
        import android.widget.LinearLayout
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(50, 50, 50, 50)
                }

                val edtGamePackage = EditText(this).apply {
                    hint = "Nhập Package Game (vd: com.vng.pubgmobile)"
                    val savedPkg = getSharedPreferences("GameConfig", Context.MODE_PRIVATE)
                        .getString("TARGET_GAME", "com.vng.pubgmobile")
                    setText(savedPkg)
                }

                val btnSave = Button(this).apply {
                    text = "Lưu Package Game"
                    setOnClickListener {
                        val pkg = edtGamePackage.text.toString().trim()
                        getSharedPreferences("GameConfig", Context.MODE_PRIVATE)
                            .edit()
                            .putString("TARGET_GAME", pkg)
                            .apply()
                        Toast.makeText(this@MainActivity, "Đã lưu!", Toast.LENGTH_SHORT).show()
                    }
                }

                val btnAccessibility = Button(this).apply {
                    text = "Bật quyền Hỗ trợ tiếp cận (Accessibility)"
                    setOnClickListener {
                        startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                    }
                }

                layout.addView(edtGamePackage)
                layout.addView
