name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Project Structure and Source Code
      run: |
        # Đổi package thành com/kinh/killtracker để không đụng độ gmsprotect
        mkdir -p app/src/main/java/com/kinh/killtracker
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/values

        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "KillappHyper"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.kinh.killtracker'
            compileSdk 34

            defaultConfig {
                applicationId "com.kinh.killtracker"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <application
                android:allowBackup="true"
                android:label="Killtracker"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".GameDetectService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>

            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault"
            android:canRetrieveWindowContent="false"
            android:notificationTimeout="100" />
        EOF

        cat << 'EOF' > app/src/main/java/com/kinh/killtracker/MainActivity.kt
        package com.kinh.killtracker

        import android.content.Context
        import android.content.Intent
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.widget.EditText
        import android.widget.LinearLayout
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(50, 50, 50, 50)
                }

                val edtGamePackage = EditText(this).apply {
                    hint = "Nhập Package Game (vd: com.vng.pubgmobile)"
                    val savedPkg = getSharedPreferences("GameConfig", Context.MODE_PRIVATE)
                        .getString("TARGET_GAME", "com.vng.pubgmobile")
                    setText(savedPkg)
                }

                val btnSave = Button(this).apply {
                    text = "Lưu Package Game"
                    setOnClickListener {
                        val pkg = edtGamePackage.text.toString().trim()
                        getSharedPreferences("GameConfig", Context.MODE_PRIVATE)
                            .edit()
                            .putString("TARGET_GAME", pkg)
                            .apply()
                        Toast.makeText(this@MainActivity, "Đã lưu!", Toast.LENGTH_SHORT).show()
                    }
                }

                val btnAccessibility = Button(this).apply {
                    text = "Bật quyền Hỗ trợ tiếp cận (Accessibility)"
                    setOnClickListener {
                        startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                    }
                }

                layout.addView(edtGamePackage)
                layout.addView(btnSave)
                layout.addView(btnAccessibility)
                setContentView(layout)
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/kinh/killtracker/GameDetectService.kt
        package com.kinh.killtracker

        import android.accessibilityservice.AccessibilityService
        import android.content.Context
        import android.content.Intent
        import android.net.Uri
        import android.provider.Settings
        import android.view.accessibility.AccessibilityEvent

        class GameDetectService : AccessibilityService() {

            private var isTriggered = false

            override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                if (event?.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                    val packageName = event.packageName?.toString() ?: return

                    val prefs = getSharedPreferences("GameConfig", Context.MODE_PRIVATE)
                    val targetGame = prefs.getString("TARGET_GAME", "com.vng.pubgmobile") ?: ""

                    if (packageName == targetGame) {
                        if (!isTriggered) {
                            isTriggered = true
                            openAppInfo("com.miui.powerkeeper")
                            openAppInfo("com.xiaomi.joyose")
                        }
                    } else if (packageName != "com.miui.powerkeeper" && 
                               packageName != "com.xiaomi.joyose" && 
                               packageName != this.packageName) {
                        isTriggered = false
                    }
                }
            }

            private fun openAppInfo(targetPkg: String) {
                val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                    data = Uri.parse("package:$targetPkg")
                    addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                }
                try {
                    startActivity(intent)
                } catch (e: Exception) {
                    e.printStackTrace()
                }
            }

            override fun onInterrupt() {}
        }
        EOF

    - name: Build Unsigned APK
      run: |
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug --no-daemon

    - name: Create KeyStore and Sign APK
      run: |
        keytool -genkeypair -v \
          -keystore my-release-key.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias my-alias \
          -storepass 123456 -keypass 123456 \
          -dname "CN=HoangKinh, OU=Dev, O=Personal, L=VN, ST=VN, C=VN"

        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks my-release-key.jks \
          --ks-pass pass:123456 \
          --key-pass pass:123456 \
          --out Killtracker.apk \
          app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release and Upload Signed APK
      uses: softprops/action-gh-release@v2
      with:
        files: Killtracker.apk
        tag_name: "v1.0.${{ github.run_number }}"
        name: "Killtracker v1.0.${{ github.run_number }}"
        body: "Bản build Killtracker.apk đã đổi sang package com.kinh.killtracker để tránh xung đột."
        draft: false
        prerelease: false
