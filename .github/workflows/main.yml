name: Build and Release Minimal Killtracker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Project Structure and Minimal Code
      run: |
        mkdir -p app/src/main/java/com/kinh/killtracker
        mkdir -p app/src/main/res/values

        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "KillappHyper"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.kinh.killtracker'
            compileSdk 34

            defaultConfig {
                applicationId "com.kinh.killtracker"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # AndroidManifest đơn giản hóa tuyệt đối
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <application
                android:allowBackup="true"
                android:label="Killtracker"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

            </application>
        </manifest>
        EOF

        # Mã nguồn MainActivity siêu ngắn: Ấn vào là bật 2 mục Cài đặt và tự thoát
        cat << 'EOF' > app/src/main/java/com/kinh/killtracker/MainActivity.kt
        package com.kinh.killtracker

        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.provider.Settings
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                // 1. Mở Cài đặt Battery & Performance (PowerKeeper)
                openAppInfo("com.miui.powerkeeper")

                // 2. Mở Cài đặt Joyose
                openAppInfo("com.xiaomi.joyose")

                // Đóng ứng dụng ngay lập tức
                finish()
            }

            private fun openAppInfo(packageName: String) {
                try {
                    val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                        data = Uri.parse("package:$packageName")
                        addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                    }
                    startActivity(intent)
                } catch (e: Exception) {
                    e.printStackTrace()
                }
            }
        }
        EOF

    - name: Build Unsigned APK
      run: |
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug --no-daemon

    - name: Create KeyStore and Sign APK
      run: |
        keytool -genkeypair -v \
          -keystore my-release-key.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias my-alias \
          -storepass 123456 -keypass 123456 \
          -dname "CN=HoangKinh, OU=Dev, O=Personal, L=VN, ST=VN, C=VN"

        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks my-release-key.jks \
          --ks-pass pass:123456 \
          --key-pass pass:123456 \
          --out Killtracker.apk \
          app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release and Upload Signed APK
      uses: softprops/action-gh-release@v2
      with:
        files: Killtracker.apk
        tag_name: "v1.0.${{ github.run_number }}"
        name: "Killtracker v1.0.${{ github.run_number }}"
        body: "Bản APK siêu gọn: Chạm vào icon để mở nhanh cài đặt PowerKeeper & Joyose."
        draft: false
        prerelease: false
