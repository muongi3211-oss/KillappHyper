name: Build and Release Killtracker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Clean Old Source and Create Clean Structure
      run: |
        rm -rf app/src/main/java/com/kinh/*
        rm -rf app/src/main/res/xml/*

        mkdir -p app/src/main/java/com/kinh/killtracker
        mkdir -p app/src/main/res/values

        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "KillappHyper"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.kinh.killtracker'
            compileSdk 34

            defaultConfig {
                applicationId "com.kinh.killtracker"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 1. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

            <application
                android:allowBackup="true"
                android:label="Killtracker"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".FloatingService"
                    android:exported="false" />

            </application>
        </manifest>
        EOF

        # 2. FloatingService.kt với Panel hiển thị 2 nút riêng biệt cho PowerKeeper và Joyose
        cat << 'EOF' > app/src/main/java/com/kinh/killtracker/FloatingService.kt
        package com.kinh.killtracker

        import android.app.Service
        import android.content.Intent
        import android.graphics.PixelFormat
        import android.net.Uri
        import android.os.Build
        import android.os.IBinder
        import android.provider.Settings
        import android.view.Gravity
        import android.view.View
        import android.view.WindowManager
        import android.widget.Button
        import android.widget.LinearLayout
        import android.widget.TextView

        class FloatingService : Service() {

            private var windowManager: WindowManager? = null
            private var floatingView: View? = null

            override fun onBind(intent: Intent?): IBinder? = null

            override fun onCreate() {
                super.onCreate()
                windowManager = getSystemService(WINDOW_SERVICE) as WindowManager

                val layoutParamsType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                } else {
                    WindowManager.LayoutParams.TYPE_PHONE
                }

                val params = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    layoutParamsType,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                    PixelFormat.TRANSLUCENT
                ).apply {
                    gravity = Gravity.TOP or Gravity.START
                    x = 100
                    y = 200
                }

                val context = this
                val container = LinearLayout(context).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(25, 25, 25, 25)
                    setBackgroundColor(0xDD111111.toInt()) // Nền đen đậm dễ nhìn trong game
                }

                // Tiêu đề Panel
                val titleText = TextView(context).apply {
                    text = "⚡ Killtracker Panel"
                    setTextColor(0xFFFFFFFF.toInt())
                    setPadding(0, 0, 0, 10)
                }
                container.addView(titleText)

                // Nút mở PowerKeeper (Battery)
                val btnPowerKeeper = Button(context).apply {
                    text = "🔋 Mở PowerKeeper (Pin)"
                    setOnClickListener {
                        openAppInfo("com.miui.powerkeeper")
                    }
                }
                container.addView(btnPowerKeeper)

                // Nút mở Joyose
                val btnJoyose = Button(context).apply {
                    text = "⚡ Mở Joyose"
                    setOnClickListener {
                        openAppInfo("com.xiaomi.joyose")
                    }
                }
                container.addView(btnJoyose)

                // Nút tắt cửa sổ nổi
                val btnClose = Button(context).apply {
                    text = "❌ Ẩn cửa sổ"
                    setOnClickListener {
                        stopSelf()
                    }
                }
                container.addView(btnClose)

                floatingView = container
                try {
                    windowManager?.addView(floatingView, params)
                } catch (e: Exception) {
                    e.printStackTrace()
                }
            }

            private fun openAppInfo(packageName: String) {
                try {
                    val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                        data = Uri.parse("package:$packageName")
                        addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                    }
                    startActivity(intent)
                } catch (e: Exception) {
                    e.printStackTrace()
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                if (floatingView != null) {
                    try {
                        windowManager?.removeView(floatingView)
                    } catch (e: Exception) {
                        e.printStackTrace()
                    }
                }
            }
        }
        EOF

        # 3. MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/kinh/killtracker/MainActivity.kt
        package com.kinh.killtracker

        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.widget.LinearLayout
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(50, 50, 50, 50)
                }

                val btnPermission = Button(this).apply {
                    text = "1. Cấp quyền Hiển thị trên ứng dụng khác"
                    setOnClickListener {
                        if (!Settings.canDrawOverlays(this@MainActivity)) {
                            val intent = Intent(
                                Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                Uri.parse("package:$packageName")
                            )
                            startActivity(intent)
                        } else {
                            Toast.makeText(this@MainActivity, "Đã có quyền hiển thị nổi!", Toast.LENGTH_SHORT).show()
                        }
                    }
                }

                val btnStart = Button(this).apply {
                    text = "2. Bật cửa sổ nổi & Vào Game"
                    setOnClickListener {
                        if (Settings.canDrawOverlays(this@MainActivity)) {
                            val intent = Intent(this@MainActivity, FloatingService::class.java)
                            if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                                startForegroundService(intent)
                            } else {
                                startService(intent)
                            }
                            Toast.makeText(this@MainActivity, "Đã hiển thị bảng điều khiển nổi!", Toast.LENGTH_SHORT).show()
                            finish()
                        } else {
                            Toast.makeText(this@MainActivity, "Vui lòng cấp quyền ở bước 1 trước!", Toast.LENGTH_LONG).show()
                        }
                    }
                }

                layout.addView(btnPermission)
                layout.addView(btnStart)
                setContentView(layout)
            }
        }
        EOF

    - name: Build Unsigned APK
      run: |
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug --no-daemon

    - name: Create KeyStore and Sign APK
      run: |
        keytool -genkeypair -v \
          -keystore my-release-key.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias my-alias \
          -storepass 123456 -keypass 123456 \
          -dname "CN=HoangKinh, OU=Dev, O=Personal, L=VN, ST=VN, C=VN"

        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks my-release-key.jks \
          --ks-pass pass:123456 \
          --key-pass pass:123456 \
          --out Killtracker.apk \
          app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release and Upload Signed APK
      uses: softprops/action-gh-release@v2
      with:
        files: Killtracker.apk
        tag_name: "v1.0.${{ github.run_number }}"
        name: "Killtracker v1.0.${{ github.run_number }}"
        body: "Bản build tích hợp bảng điều khiển nổi với 2 nút riêng biệt cho PowerKeeper và Joyose."
        draft: false
        prerelease: false
