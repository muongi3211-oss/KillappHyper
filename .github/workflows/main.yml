name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*' # Tự động chạy khi bạn push tag (ví dụ: v1.0.0)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Quyền cần thiết để tạo GitHub Release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Project Structure and Source Code
      run: |
        # Tạo cấu trúc thư mục chuẩn khớp với com/kinh/gmsprotect
        mkdir -p app/src/main/java/com/kinh/gmsprotect
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/values

        # 1. Tạo gradle.properties
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        # 2. Tạo settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "KillappHyper"
        include ':app'
        EOF

        # 3. Tạo build.gradle cấp root
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        # 4. Tạo app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.kinh.gmsprotect'
            compileSdk 34

            defaultConfig {
                applicationId "com.kinh.gmsprotect"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 5. Tạo AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <application
                android:allowBackup="true"
                android:label="GmsProtect"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".GameDetectService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>

            </application>
        </manifest>
        EOF

        # 6. Tạo file cấu hình accessibility_service_config.xml
        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault"
            android:canRetrieveWindowContent="false"
            android:notificationTimeout="100" />
        EOF

        # 7. Tạo mã nguồn MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/kinh/gmsprotect/MainActivity.kt
        package com.kinh.gmsprotect

        import android.content.Context
        import android.content.Intent
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.widget.EditText
        import android.widget.LinearLayout
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(50, 50, 50, 50)
                }

                val edtGamePackage = EditText(this).apply {
                    hint = "Nhập Package Game (vd: com.vng.pubgmobile)"
                    val savedPkg = getSharedPreferences("GameConfig", Context.MODE_PRIVATE)
                        .getString("TARGET_GAME", "com.vng.pubgmobile")
                    setText(savedPkg)
                }

                val btnSave = Button(this).apply {
                    text = "Lưu Package Game"
                    setOnClickListener {
                        val pkg = edtGamePackage.text.toString().trim()
                        getSharedPreferences("GameConfig", Context.MODE_PRIVATE)
                            .edit()
                            .putString("TARGET_GAME", pkg)
                            .apply()
                        Toast.makeText(this@MainActivity, "Đã lưu!", Toast.LENGTH_SHORT).show()
                    }
                }

                val btnAccessibility = Button(this).apply {
                    text = "Bật quyền Hỗ trợ tiếp cận (Accessibility)"
                    setOnClickListener {
                        startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                    }
                }

                layout.addView(edtGamePackage)
                layout.addView(btnSave)
                layout.addView(btnAccessibility)
                setContentView(layout)
            }
        }
        EOF

        # 8. Tạo mã nguồn GameDetectService.kt
        cat << 'EOF' > app/src/main/java/com/kinh/gmsprotect/GameDetectService.kt
        package com.kinh.gmsprotect

        import android.accessibilityservice.AccessibilityService
        import android.content.Context
        import android.content.Intent
        import android.net.Uri
        import android.provider.Settings
        import android.view.accessibility.AccessibilityEvent

        class GameDetectService : AccessibilityService() {

            private var isTriggered = false

            override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                if (event?.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                    val packageName = event.packageName?.toString() ?: return

                    val prefs = getSharedPreferences("GameConfig", Context.MODE_PRIVATE)
                    val targetGame = prefs.getString("TARGET_GAME", "com.vng.pubgmobile") ?: ""

                    if (packageName == targetGame) {
                        if (!isTriggered) {
                            isTriggered = true
                            openAppInfo("com.miui.powerkeeper")
                            openAppInfo("com.xiaomi.joyose")
                        }
                    } else if (packageName != "com.miui.powerkeeper" && 
                               packageName != "com.xiaomi.joyose" && 
                               packageName != this.packageName) {
                        isTriggered = false
                    }
                }
            }

            private fun openAppInfo(targetPkg: String) {
                val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                    data = Uri.parse("package:$targetPkg")
                    addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                }
                try {
                    startActivity(intent)
                } catch (e: Exception) {
                    e.printStackTrace()
                }
            }

            override fun onInterrupt() {}
        }
        EOF

    - name: Build APK with Gradle
      run: |
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HyperOS-Kill-Tracker-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        name: Release ${{ github.ref_name }}
        body: "Tự động phát hành bản build APK mới nhất cho HyperOS."
        draft: false
        prerelease: false
